name: tracecloak
description: Masks API keys, tokens and passwords in Dart and Flutter print() output, logs, Dio HTTP logs, crash reports and AI prompts. Zero custody, off in release builds by default.
version: 0.1.0
homepage: https://github.com/vinittailor/tracecloak_flutter
repository: https://github.com/vinittailor/tracecloak_flutter
issue_tracker: https://github.com/vinittailor/tracecloak_flutter/issues
topics:
  - security
  - logging
  - privacy
  - secrets
  - ai

# Tests contain fake, secret-shaped strings on purpose (redaction fixtures).
false_secrets:
  - /test/**

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dio: ^5.11.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0
